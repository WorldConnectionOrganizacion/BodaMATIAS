app = "boda-matias"
primary_region = "scl"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/salud"

[[mounts]]
  source = "boda_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
