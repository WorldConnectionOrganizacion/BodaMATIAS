<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="240" height="130">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&amp;family=Pinyon+Script&amp;display=swap');
      .script-char { font-family: 'Pinyon Script', 'Brush Script MT', cursive; }
      .serif-text { font-family: 'Cormorant Garamond', 'Garamond', serif; }
    </style>
    <filter id="badge-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1208" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Outer Scalloped Cartouche Path -->
  <path d="M 50 15 C 80 12 160 12 190 15 C 205 16 215 26 218 38 C 220 45 225 50 232 55 C 236 59 236 71 232 75 C 225 80 220 85 218 92 C 215 104 205 114 190 115 C 160 118 80 118 50 115 C 35 114 25 104 22 92 C 20 85 15 80 8 75 C 4 71 4 59 8 55 C 15 50 20 45 22 38 C 25 26 35 16 50 15 Z"
        fill="#3E2C0F" stroke="#B88636" stroke-width="1.8" filter="url(#badge-shadow)" />
  <!-- Inner Inset Contour -->
  <path d="M 52 20 C 80 17 160 17 188 20 C 201 21 210 30 213 41 C 215 47 220 52 226 57 C 229 60 229 70 226 73 C 220 78 215 83 213 89 C 210 100 201 109 188 110 C 160 113 80 113 52 110 C 39 109 30 100 27 89 C 25 83 20 78 14 73 C 11 70 11 60 14 57 C 20 52 25 47 27 41 C 30 30 39 21 52 20 Z"
        fill="none" stroke="#D4A85B" stroke-width="0.9" opacity="0.8" />
  <!-- Monogram Script 'D' and 'RESS CODE' -->
  <text x="75" y="80" class="script-char" font-size="64" fill="#FDFBF7" text-anchor="middle" font-style="italic">D</text>
  <text x="122" y="58" class="serif-text" font-size="16" font-weight="600" letter-spacing="3" fill="#FDFBF7" text-anchor="start">RESS</text>
  <text x="114" y="82" class="serif-text" font-size="18" font-weight="600" letter-spacing="4" fill="#FDFBF7" text-anchor="start">CODE</text>
</svg>