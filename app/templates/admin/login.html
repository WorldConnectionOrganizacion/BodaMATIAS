{% extends "admin/base.html" %}
{% block titulo %}Ingresar · Gestión{% endblock %}
{% block contenido %}
<div class="panel panel--angosto">
  <h1 class="titulo">Gestión de invitados</h1>
  {% if error %}<p class="aviso aviso--error">Contraseña incorrecta.</p>{% endif %}
  <form method="post" action="/admin/login" class="formulario">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Tu nombre (para el registro de puerta)
      <input type="text" name="operador" placeholder="Ej: Juan">
    </label>
    <label>Contraseña
      <input type="password" name="password" required autofocus>
    </label>
    <button class="btn btn--solido" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
